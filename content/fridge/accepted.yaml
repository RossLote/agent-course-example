title: "Module 03: what you accepted"
caption: >-
  Four shelves, eight items, the client's rules. A wrong drop returns the item and says why. The
  score is right-first-time out of eight. No timer, no leaderboard. The screen reader hears item,
  shelf and result.
shelves:
  - id: top
    name: Top shelf
    subtitle: ready to eat
  - id: middle
    name: Middle shelf
    subtitle: cooked food and leftovers, covered
  - id: bottom
    name: Bottom shelf
    subtitle: raw meat and fish
  - id: salad-drawer
    name: Salad drawer
    subtitle: fruit and veg
items:
  - id: cheese
    name: Cheese
    shelf: top
    reason: Dairy goes on the top shelf, away from raw meat.
  - id: yoghurt
    name: Yoghurt
    shelf: top
    reason: Dairy goes on the top shelf, away from raw meat.
  - id: cooked-chicken
    name: Cooked chicken
    shelf: middle
    reason: Cooked food goes on the middle shelf, covered, above anything raw.
  - id: leftover-lasagne
    name: Leftover lasagne (sealed)
    shelf: middle
    reason: Leftovers go on the middle shelf, sealed, above anything raw.
  - id: raw-chicken
