# The course: its id, its description, the copy of its two course-level pages (the scenario
# and the home page), the labels the box is drawn with, and its eight modules in order.
# Every field is documented in content/README.md.

# The course activity id (D24): the root of every module, check, interaction and fridge id.
id: https://rosslote.github.io/agent-course/
title: Getting the most out of agents
# Written into tincan.xml by `npm run package`.
description: >-
  A course on working with AI agents, built from Ross Lote's workflow for building with them,
  by that workflow.

box:
  centre: the builder
  walls:
    record: 01 the record
    done: 02 done
    gate: 03 the gate
    agents: 04 other agents
    evidence: 05 evidence
  ring: "the retro: round again, change the check"

scenario:
  label: The scenario
  role: "Your role: learning designer"
  heading: A client wants something the authoring tool can't do. You have an AI agent. You've never used one for this.
  memo:
    from: the client
    date: Monday, 9:05
    subject: One more thing for the food-hygiene course
    body:
      - >-
        Loved the draft. One more thing before sign-off: can we have a fridge activity?
        Learners drag food onto the right shelf of a fridge (raw meat at the bottom, that sort
        of thing) and get told why when they get it wrong. Our kitchen staff do this on
        induction, usually on the tablet in the staff room.
      - Does the tool do that? If not, what would it take?
  lines:
    - title: The tool doesn't do it.
      text: >-
        Its drag-and-drop can't do shelves with rules and feedback. The bespoke team would
        build it in code, and they're booked for a month.
    - title: You have an agent that writes code.
      text: >-
        Your job is not to build the activity. It is to get something out of the agent that
        you would put in front of this client: answer its questions, decide what done means,
        put checks round it, judge what comes back.
    - title: The agent in this course is scripted, nothing real.
      text: >-
        It behaves as real ones do: fast, confident, helpful, and happy to fill a gap with a
        guess. You will see it go wrong, and you will learn the walls that stop it.
  button: Take the job
  note: Eight short modules, about 50 minutes. Leave after any one and come back; the job waits.

home:
  meta: Eight modules · about 50 minutes
  leave: Leave after any module and come back
  eyebrow: The one thing to remember
  heading: Agents are better at reviewing than building.
  quote:
    text: >-
      So whenever you have agents do anything, also have agents look at what the agents have
      done. Put the agent in a tight box it can't wander off from, and check, and check again.
    attribution: Ross Lote
  line: >-
    Every module adds one wall to the box on the right. By the end you can set up a piece of
    agent work so that you can trust what comes back.
  start: Start module 00
  scenarioLink: The scenario again
  box:
    centre: the agent
    caption: An open box. The walls go up one module at a time; the retro is the arrow round the whole thing.
  modulesHeading: The modules

# In order. `wall` is what the module adds to the box: none, record, done, gate, agents,
# evidence, ring (the retro's arrow round the box) or all (the whole box, at the end).
modules:
  - slug: "00"
    title: What works and what doesn't
    minutes: 5
    wall: none
    wallLabel: the open box
    blurb: A vague ask, and what an agent does with it.
    file: modules/00.yaml
  - slug: "01"
    title: Write it down
    minutes: 7
    wall: record
    wallLabel: "wall 1: the record"
    blurb: The agent asks, you decide, the decisions are on the record.
    file: modules/01.yaml
  - slug: "02"
    title: Define done before you start
    minutes: 7
    wall: done
    wallLabel: "wall 2: done"
    blurb: Pieces with acceptance a reviewer can see.
    file: modules/02.yaml
  - slug: "03"
    title: The box
    minutes: 6
    wall: gate
    wallLabel: "wall 3: the gate"
    blurb: Tests and checks that must be green before done.
    file: modules/03.yaml
  - slug: "04"
    title: Agents checking agents
    minutes: 9
    wall: agents
    wallLabel: "wall 4: other agents"
    blurb: Simplify, review, adversarial review. You play the skeptic.
    file: modules/04.yaml
  - slug: "05"
    title: Judging what comes back
    minutes: 6
    wall: evidence
    wallLabel: "wall 5: evidence"
    blurb: Door, undo, walkthrough. Merge or not.
    file: modules/05.yaml
  - slug: "06"
    title: Round again
    minutes: 6
    wall: ring
    wallLabel: the arrow round the box
    blurb: A second round, and the check that missed.
    file: modules/06.yaml
  - slug: "07"
    title: Put it together
    minutes: 6
    wall: all
    wallLabel: all of them
    blurb: A new request. Name the wall for each thing that goes wrong.
    file: modules/07.yaml
