slug: "04"
screens:
  - type: scene
    heading: The client tries it
    blocks:
      - type: paragraph
        text: >-
          The fridge activity is live. The client's feedback: "Great. Could learners get a hint
          after two wrong drops? And the salad drawer should take the eggs too." Neither is in
          the brief. Nothing went wrong. This is round two.
      - type: quote
        text: >-
          The first round is not necessarily the one that hits. You merge it, and you go round
          again. You may not know what you want until you see the first round.
        attribution: Ross

  - type: scene
    heading: Rounds
    nav: rounds
    blocks:
      - type: cards
        numbered: true
        items:
          - title: Big things are not one-shot.
            body: >-
              A small fix, yes. A piece of a course, no: a first round to see it, a second to get
              it right. Expecting that is not failure; it is the plan.
          - title: The first round's feedback shapes the second.
            body: >-
              Round two starts with a brief, from what the client saw. The hint and the eggs
              become decisions D9 and D10, a short plan, a run, a pull request. Same loop,
              smaller.
          - title: Each round leaves a record.
            body: >-
              The decisions, the pieces, the run's record, the pull request. The next brief starts
              from them, not from memory.

  - type: scene
    eyebrow: A true story
    heading: The check that missed
    intro: >-
      Not every miss is the client's taste. Sometimes a wall has a gap. This happened, in Ross's
      work, in October 2026.
    nav: the check that missed
    blocks:
      - type: cards
        numbered: true
        items:
          - title: Built twice.
            body: >-
              A feature was built twice, on purpose: once by an agent in one go, with no brief
              and none of this workflow, and once by this workflow, with every agent told to
              ignore the other attempt. The question was whether the workflow did any better
              than the one-shot.
          - title: A person caught it.
            body: >-
              A reviewer on the one-shot version asked for one change. A check on who may edit
              a record looked at whether a field was **present** in what was sent, when it
              should have looked at whether the field was **changing**. An ordinary user who
              opened a record, changed something else and saved it would have been turned away.
          - title: The workflow had it too, so the workflow changed.
            body: >-
              The workflow's version had the same check. It had been written into the plan as a
              settled decision, so every agent respected it and no reviewer questioned it. In the
              days after, three things changed: a new question for the reviewers, *what would an
              ordinary user do?*; a new rule for the skeptics, that "the spec says so" refutes
              nothing when the spec is the problem; and a new step, the retro, which reads
              several runs' records back to find what goes wrong more than once.
      - type: paragraph
        text: "*The agent was not told to be more careful. The check was changed.*"
      - type: aside
        term: retro
        text: >-
          reading several runs' records back to see what went wrong more than once, and
          proposing changes to the process.

  - type: scene
    heading: Make it yours
    nav: make it yours
    blocks:
      - type: paragraph
        text: >-
          Everything in this course runs on a handful of skills: written-down ways of working
          that the agent follows every time. One holds the brief, one writes the plan, one reads
          the plan for gaps, one runs the job while you are away, one runs the reviews, one
          writes up what comes back, and one reads the runs back for the retro.
      - type: paragraph
        text: >-
          Ross did not invent them on a blank page. He told the agent how he works and had it
          written down, and after each run he changed whatever had missed. That is all a skill
          is: your way of working, said once, followed every time.
      - type: paragraph
        text: >-
          **If you have a process you like, tell the agent about it and have it made into a
          skill.** Talk it through as you would a brief: let it ask what it needs and suggest
          what you had not thought of.
      - type: quote
        text: >-
          If you have a process you like, talk to the agent about it and make a skill of it. You
          don't have to come up with all the solutions yourself.
        attribution: Ross
      - type: aside
        term: skill
        text: >-
          a written-down way of working that the agent follows every time. A process you like
          can become one.

  - type: choose
    slug: your-process
    scored: false
    mode: single
    eyebrow: Try it
    heading: You have a process. What do you do with it?
    intro: >-
      Every activity you make is checked against your accessibility checklist before it ships.
      Now an agent is building some of them.
    prompt: What do you do with the checklist?
    nav: your process
    options:
      - label: Paste the checklist into every prompt.
        right: false
        feedback: >-
          It works until the day you forget. And a checklist in a prompt is advice, not a wall:
          nothing stops the work coming back without it.
      - label: >-
          Give the agent the checklist and have it made into a skill that runs on every piece
          before it is handed back.
        right: true
        feedback: >-
          Yes. You say it once and it runs on every piece, whether or not you remember. When it
          misses something, you change the skill, not your habits.
      - label: Check it by hand each time.
        right: false
        feedback: >-
          Then you are the gate, every time, on every piece, and the day you are busy is the day
          it slips.
    after:
      - type: paragraph
        text: "**Say it once. It runs every time.**"

  - type: choose
    slug: check-1
    scored: true
    mode: single
    eyebrow: Check · 1 of 2
    heading: The client asks for two things that were not in the brief. What does that mean?
    intro: Every module ends with two of these. Each option tells you why, right or wrong.
    nav: check
    options:
      - label: The brief failed.
        right: false
        feedback: >-
          It did not. The client saw round one and knew what they wanted. That is what round one
          is for.
      - label: "Round two: a short brief, two decisions, a small run."
        right: true
        feedback: Yes. Same loop, smaller.
      - label: The builder should have anticipated it.
        right: false
        feedback: Then it would have guessed. Module 00.

  - type: choose
    slug: check-2
    scored: true
    mode: single
    eyebrow: Check · 2 of 2
    heading: A review missed a bug that a person caught. What is the useful question?
    nav: question 2
    options:
      - label: Which agent was at fault?
        right: false
        feedback: None of them disobeyed anything. They did what the process asked.
      - label: Which check, if it had existed, would have caught it, and does the miss repeat?
        right: true
        feedback: Yes. That is the retro's question.
      - label: Should we stop trusting the reviews?
        right: false
        feedback: >-
          They found fifty things in one run. One miss is a gap to close, not a reason to go back
          to reading everything.

  - type: scene
    heading: Try this tomorrow
    nav: try this tomorrow
    intro: Five cards for any agent, including the chat tools you already use.
    blocks:
      - type: cards
        numbered: true
        items:
          - title: Before you ask for anything, ask it to ask you five questions first.
            body: >-
              Answer in a paragraph. Watch how much of what it would have guessed you had an
              opinion on.
          - title: Have it write the finish line, and read it before it starts.
            body: >-
              Ask what you will be able to do and see when it is finished. If the answer is
              adjectives, or leaves out something you care about, say so now.
          - title: When it says done, open a new chat and ask a fresh agent what is wrong with it.
            body: Make it say where. Do not let it say "looks fine".
          - title: Ask for the evidence, not the explanation.
            body: >-
              "Show me it doing step 2" beats "tell me it works".
          - title: Tell it how you like to work, and have it make that a skill.
            body: >-
              The checks you always run, the questions you always ask. Said once, followed every
              time, and changed when one misses.

  - type: takeaway
    eyebrow: Takeaway
    nav: the end
    text: >-
      **Expect a second round. When a check misses, change the check.** The process is not set in
      stone; it is the thing you improve, and the way you like to work can become a skill.
    caption: The four walls are up, and the arrow of the retro is drawn round them.
    end:
      - type: paragraph
        text: >-
          This course was built the way it describes: a brief, a plan, a run with builders in
          their boxes, three layers of review, a recorded walkthrough someone judged. The record
          is in its repository. Nothing in it was one-shot.
      - type: paragraph
        text: "*Ross Lote's workflow; the course built with it.*"
