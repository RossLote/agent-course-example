slug: "00"
screens:
  - type: scene
    heading: The request
    blocks:
      - type: paragraph
        text: >-
          A client's food-hygiene course needs a fridge activity: learners drag food onto the right
          shelf of a fridge and are told why when they get it wrong. Our authoring tool's
          drag-and-drop can't do shelves with rules, so it will be built in code. You have an agent.
      - type: paragraph
        text: "*Let's do what most people do first.*"

  - type: chat
    slug: just-ask
    eyebrow: Try it
    heading: Just ask
    intro: The client wants a fridge activity. You have an agent. Let's do what most people do first.
    nav: just ask
    opening: Build a drag-and-drop fridge activity for the food hygiene course.
    messages:
      - >-
        Done! I've built a fridge activity. It has five shelves and fourteen food items, a
        15-second timer to keep it exciting, a leaderboard so learners can compete, and confetti
        when they finish. I assumed the standard fridge rules. I ran through it myself and it
        works great. Want me to add sound effects?
    side:
      - type: paragraph
        heading: What to watch for
        text: >-
          Read the agent's reply twice. Count the things you did not ask for. Count the things it
          decided. Notice who tested it.

  - type: scene
    heading: Hold its hand
    nav: hold its hand
    blocks:
      - type: paragraph
        text: >-
          Some people go the other way. They hold the agent's hand: a page that says exactly what
          to build, down to every shelf, every item, every message and every file, so there is
          nothing left to guess. Here is that page, and what came back.
      - type: list
        heading: Your page
        style: bullets
        items:
          - "Four shelves, top to bottom: top shelf, middle shelf, bottom shelf, salad drawer."
          - >-
            Eight items in the tray: cheese, yoghurt, cooked chicken, leftover lasagne, raw
            chicken, raw salmon, lettuce, tomatoes.
          - >-
            Cheese and yoghurt go on the top shelf. Lasagne goes on the middle shelf. Raw chicken,
            raw salmon and cooked chicken go on the bottom shelf. Lettuce and tomatoes go in the
            salad drawer.
          - >-
            A right drop shows "Correct!" in green. A wrong drop shows "Wrong, try again" in red,
            and the item goes back to the tray.
          - When all eight are placed, show "Well done!" and the score out of eight.
          - >-
            Four files: one for the shelves, one for the items, one for the messages, one for the
            score. Use the colours in the client's style guide.
          - Build exactly this. Nothing else.
      - type: quote
        text: >-
          Done. Four shelves, eight items and four files, exactly as you set out. A right drop
          shows "Correct!" in green; a wrong drop shows "Wrong, try again" in red and the item goes
          back to the tray. Cooked chicken goes on the bottom shelf with the raw chicken and the
          raw salmon, as listed. When all eight are placed it shows "Well done!" and the score out
          of eight.
        attribution: The agent
      - type: paragraph
        text: >-
          Everything on the page is there, and nothing else. A wrong drop says "Wrong, try again"
          and never why, because the page never thought of reasons, and telling staff why is what
          the client's course is for. The cooked chicken sits on the bottom shelf beside the raw,
          where raw juices can drip onto food nobody will cook again, because the page got it
          wrong. And the agent suggests nothing, because the page left it no room to.
      - type: paragraph
        text: "*Two ways to ask, two ways to lose. Back to the one line first.*"
    side:
      - type: paragraph
        heading: What to watch for
        text: >-
          The one-line ask left every gap open, and the agent filled them with guesses. This page
          leaves no gap at all, so your own mistakes are built in, and nothing you did not think
          of gets in.

  - type: choose
    slug: what-went-wrong
    scored: false
    mode: multi
    eyebrow: Try it
    heading: Tick everything that went wrong here.
    nav: tick everything that went wrong
    body:
      - type: quote
        text: >-
          Done! I've built a fridge activity. It has five shelves and fourteen food items, a
          15-second timer to keep it exciting, a leaderboard so learners can compete, and confetti
          when they finish. I assumed the standard fridge rules. I ran through it myself and it
          works great. Want me to add sound effects?
        attribution: The agent
    options:
      - label: "It built things nobody asked for: the timer, the leaderboard, the confetti."
        right: true
        feedback: Yes. Every gap in your ask was filled with a guess, and the guesses were fun rather than right.
      - label: It invented the rules.
        right: true
        feedback: >-
          Yes. "I assumed the standard fridge rules" means it decided what the client's course
          teaches.
      - label: It checked its own work.
        right: true
        feedback: >-
          Yes. "I ran through it myself and it works great" is the builder marking its own
          homework.
      - label: It should have said no.
        right: false
        feedback: No. It did nothing wrong by building; the ask left it nothing to build to.
      - label: It was too slow.
        right: false
        feedback: No. It was fast. Speed is not the problem; direction is.
    after:
      - type: cards
        heading: What just happened
        numbered: true
        items:
          - title: It filled every gap with a guess.
            body: >-
              Agents do not stop at a gap; they fill it, and they sound sure when they do. The
              timer came from a gap you left.
          - title: It built more than you asked.
            body: >-
              Given room, an agent builds into it. More is not better; more is more to check.
          - title: It marked its own homework.
            body: The agent that built it is the worst judge of it. It believes its own plan.
          - title: Too tight gets your own blind spots.
            body: >-
              The page-long ask got exactly what it said: no reasons, and the cooked chicken beside
              the raw. Hold its hand and your mistakes are built in, and it has no room to suggest
              anything better. The middle way is the next module: describe it loosely, then let it
              ask.
          - title: Here is the part that works.
            body: >-
              The same agent, pointed at someone else's work with a clear question, is sharp. That
              asymmetry is the whole workflow: box the builder, then let the reviewers loose.

  - type: fridge
    eyebrow: Try it
    heading: Try what it built
    nav: try what it built
    intro: Optional, fifteen seconds. The timer starts as soon as you pick something up.
    fridge: one-shot

  - type: choose
    slug: check-1
    scored: true
    mode: single
    eyebrow: Check · 1 of 2
    heading: Your agent built a feature you never mentioned. What most likely happened?
    intro: Every module ends with two of these. Each option tells you why, right or wrong.
    nav: check
    options:
      - label: It misread your message.
        right: false
        feedback: Not usually. It read what you wrote; the feature came from what you did not write.
      - label: It filled a gap in your ask with a guess.
        right: true
        feedback: Yes. Gaps get filled, confidently.
      - label: It was showing off.
        right: false
        feedback: Agents do not show off; they complete. An open ask is completed with more.

  - type: choose
    slug: check-2
    scored: true
    mode: single
    eyebrow: Check · 2 of 2
    heading: The agent says "I tested it myself and it all works." What is that worth?
    nav: question 2
    options:
      - label: "A lot: it has run the code and you have not."
        right: false
        feedback: It is the builder's word. The builder believes its own plan, including the parts that are wrong.
      - label: "Something, but not a sign-off: another agent, or a test, has to look."
        right: true
        feedback: Yes. The course is about what that looking looks like.
      - label: "Nothing: agents lie."
        right: false
        feedback: They do not lie; they are sure. Those are different problems with the same fix.

  - type: takeaway
    eyebrow: Takeaway
    nav: takeaway
    text: >-
      **The builder is the worst judge of its own work.** Everything that follows is about putting
      walls round the builder and letting the reviewers in.
    caption: The box gains nothing yet; the next module adds the first wall.
