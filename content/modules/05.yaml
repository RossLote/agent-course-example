slug: "05"
screens:
  - type: scene
    heading: It finished at two in the morning
    blocks:
      - type: paragraph
        text: >-
          The run built five pieces, simplified, reviewed, fixed, recorded the walkthrough and
          wrote up the result. It is waiting for you: forty changed files. Reading them is not
          your job. Judging them is.
      - type: aside
        term: pull request
        text: >-
          the hand-back: everything the run did, written for one time-poor reviewer who will not
          read the code.

  - type: scene
    heading: The first three lines
    nav: the first three lines
    blocks:
      - type: list
        heading: The fridge pull request's top, as it would appear
        style: bullets
        items:
          - "**Two-way door.** Reverting the merge removes the activity and nothing else depends on it."
          - "**Before merging:** nothing."
          - "**Undo:** revert the merge commit and redeploy."
      - type: cards
        numbered: true
        items:
          - title: The door.
            body: >-
              *Two-way* if undoing puts everything back; *one-way* if something is dropped or
              changed for good (data deleted, a format changed). The door is the worst signal in
              the change, never an average. You read this line first because it sets how careful
              the rest of your reading has to be.
          - title: Before merging.
            body: 'What someone has to do first, if anything. "Nothing" is an answer.'
          - title: Undo.
            body: >-
              A recipe, not a reassurance. If it cannot be written, the door is one-way.
      - type: aside
        term: door
        text: whether undoing the change puts everything back.

  - type: scene
    heading: The rest of the page
    nav: the rest of the page
    intro: What follows the three lines.
    blocks:
      - type: cards
        items:
          - title: What changed, in one picture.
            body: A diagram of the piece and where it sits.
          - title: Evidence, matched to the change.
            body: >-
              For a thing you can see: the recorded walkthrough of the demo script, one chapter
              per step, slowed down so a person can follow it. For a bug fix: the test that
              failed and now passes.
          - title: A review guide.
            body: >-
              At most ten places to look, each with what to check there. Not the whole change:
              the places where a mistake would hide.
          - title: Choices made for you.
            body: >-
              Everything the run decided on its own, in a list, so you can disagree with any of
              them.
      - type: quote
        text: >-
          The pull request is the point where everything the agents did is shown to you in a way
          you can consume safely.
        attribution: Ross

  - type: scene
    eyebrow: Try it
    heading: Merge or not?
    intro: >-
      It finished at two in the morning. Forty changed files. Reading them is not your job;
      judging them is. Here is the pull request, condensed to what matters.
    nav: merge or not?
    blocks:
      - type: paragraph
        heading: Pull request · ready for review
        text: >-
          **Fridge activity: shelves, dragging, keyboard, feedback and score.** 5 beads · 40
          files · gate green · simplify 11 applied · review 4 fixed · adversarial 7 findings, 5
          confirmed, 5 fixed
      - type: list
        style: bullets
        items:
          - "**Two-way door.** Reverting the merge removes the activity and nothing else depends on it."
          - "**Before merging:** nothing."
          - "**Undo:** revert the merge commit and redeploy."
      - type: list
        heading: Evidence · the recorded walkthrough, one chapter per step
        items:
          - text: "Open: four shelves, eight items in the tray."
            marker: ch 1
            tone: right
          - text: "Raw chicken to the top shelf: returns, message as specified."
            marker: ch 2
            tone: right
          - text: "Raw chicken to the bottom shelf: stays."
            marker: ch 3
            tone: right
          - text: >-
              Keyboard: Tab to lettuce, Enter, arrow down three times, Enter: placed. Screen
              reader: "Lettuce placed. Correct."
            marker: ch 4
            tone: right
          - text: >-
              All eight placed: "7 out of 8 right first time", raw chicken listed with its
              reason.
            marker: ch 5
            tone: right
          - text: "Try again: tray full, score cleared."
            marker: ch 6
            tone: right
      - type: paragraph
        heading: Choices made for you
        text: >-
          The screen reader announcement names the item and the result; the shelf is implied by
          focus, so it is not read out.
      - type: list
        heading: Review guide (about 6 minutes)
        items:
          - The rules file against the client's guide.
          - The drop handler's message replacement (the adversarial fix).
          - The score screen's wording against D4.
    side:
      - type: cards
        heading: Read it in this order
        items:
          - title: 1. The door.
            body: >-
              Two-way if undoing puts everything back; one-way if something is lost for good. The
              worst signal in the change, never an average.
          - title: 2. Before merging, and undo.
            body: A recipe, not a reassurance.
          - title: 3. Evidence against the acceptance.
            body: >-
              One chapter per step of the demo script. A missing chapter is missing proof.
          - title: 4. Choices made for you.
            body: >-
              Everything the run decided alone, so you can disagree with any of it.
      - type: list
        heading: The record, for reference
        items:
          - text: >-
              Keyboard: Enter picks up, arrows move between shelves, Enter places; a screen
              reader hears **item, shelf and result**.
            marker: D5
          - text: >-
              "Lettuce placed **in the salad drawer**. Correct."
            marker: step 4

  - type: choose
    slug: merge-or-not
    scored: false
    mode: single
    eyebrow: Try it
    heading: What do you do?
    nav: "what do you do?"
    options:
      - label: Merge. Every chapter passes and the choice is reasonable.
        right: false
        feedback: >-
          Every chapter plays, but chapter 4 does not match the acceptance. D5 and step 4 say the
          announcement names the item, the shelf and the result. "Implied by focus" is the
          builder deciding what the client's learners need. Reasonable is not the test; the
          record is.
      - label: >-
          Send it back as one piece of work: the announcement must name the shelf, per D5 and
          step 4.
        right: true
        feedback: >-
          Yes. You judged from the evidence against the acceptance, found the one gap, and sent
          back exactly that. It goes through the box like any other piece.
      - label: Read the forty files to be sure there is nothing else.
        right: false
        feedback: >-
          You can, but the reviews already did, with lenses and evidence. Your time goes on
          judging the evidence against the record. If the evidence were missing, that would be
          the reason to send it back.
    after:
      - type: paragraph
        text: >-
          You did not read a line of code. You read six chapters against six steps and a list of
          choices against eight decisions.

  - type: compare
    eyebrow: The job, done
    heading: The two fridges
    intro: >-
      On the left, what the agent handed you in module 00 from a one-line ask. On the right, what
      you just accepted. Both work. Try them.
    nav: the two fridges
    left: one-shot
    right: accepted
    table:
      heading: What is different, and which wall made the difference
      rows:
        - aspect: Shelves and items
          left: Five shelves including "the door", fourteen items.
          right: Four shelves, eight items, the ones in the client's guide.
          wall: 01 the record (D2)
        - aspect: The rules
          left: The agent's guess. Raw chicken is accepted on the lower middle shelf.
          right: The client's guide. Raw meat and fish on the bottom shelf, with the reason.
          wall: 01 the record (D2)
        - aspect: A wrong drop
          left: Snaps back with a red flash. Nothing says why.
          right: Returns, with a one-line reason. Unlimited tries.
          wall: 02 done (step 2 of the script)
        - aspect: The score
          left: Points, a leaderboard against people who do not exist, confetti.
          right: Right first time out of eight, wrong ones listed with their reasons, Try again.
          wall: 01 the record (D4, D6, D7)
        - aspect: Time
          left: Sixty seconds, then "Time's up".
          right: None. Induction, not a game.
          wall: 01 the record (D6)
        - aspect: Keyboard and screen reader
          left: >-
            Added for this course so everyone can try it; a one-shot build would have had
            neither.
          right: >-
            Enter, arrows, Enter; the reader hears item, shelf and result, and the pull request
            was sent back once to get the shelf in.
          wall: 02 done · 03 the gate · 05 evidence

  - type: choose
    slug: check-1
    scored: true
    mode: single
    eyebrow: Check · 1 of 2
    heading: >-
      A pull request's door line says "Two-way door" but the change deletes a column of learner
      data. What is wrong?
    intro: Every module ends with two of these. Each option tells you why, right or wrong.
    nav: check
    options:
      - label: Nothing; the code can be reverted.
        right: false
        feedback: The code can. The data cannot. A revert does not put the column back.
      - label: >-
          The door is wrong: it is one-way, and the rest of the page has to be read as one.
        right: true
        feedback: Yes. The door is the worst signal in the change.
      - label: It should say "no door".
        right: false
        feedback: Every change has a door. This one is one-way.

  - type: choose
    slug: check-2
    scored: true
    mode: single
    eyebrow: Check · 2 of 2
    heading: >-
      The walkthrough has five chapters and the demo script has six steps. What does that tell
      you?
    nav: question 2
    options:
      - label: The sixth step was not important.
        right: false
        feedback: The script is the definition of done. A missing step is missing proof.
      - label: One step has no evidence, so it is not shown to be done.
        right: true
        feedback: Yes. Send it back for the chapter, or for the fix the chapter would have shown.
      - label: The video was cut for length.
        right: false
        feedback: Then the proof was cut for length.

  - type: takeaway
    eyebrow: Takeaway
    nav: takeaway
    text: >-
      **You still sign off. You just do not start from the code.** Door, undo, evidence against
      the acceptance, the choices made for you. A gap in the evidence is a gap in the work.
    caption: "The box gains its fifth wall: **evidence**."
